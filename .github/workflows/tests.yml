name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.12.0, v0.12.6]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: v2.6.0
          args: --check lua tests
      - name: Install pinned sibling fixtures
        run: python3 tests/run.py fixtures
      - name: Registered runtime and UI tests
        run: sh tests/run.sh default --locked --output "$RUNNER_TEMP/test-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.neovim }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.12.6
          neovim: true
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install pinned sibling fixtures
        run: python3 tests/run.py fixtures
      - name: Install pinned Lua language server
        run: |
          curl --fail --location --retry 3 \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            -o "$RUNNER_TEMP/luals.tar.gz"
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  $RUNNER_TEMP/luals.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Required cross-plugin workflows
        run: sh tests/run.sh integration --locked --output "$RUNNER_TEMP/integration-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration
          path: ${{ runner.temp }}/integration-results
          if-no-files-found: ignore
